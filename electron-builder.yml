appId: id.termos.app
productName: Termos
directories:
  buildResources: build
files:
  - '!**/.vscode/*'
  - '!src/*'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!{.eslintcache,eslint.config.mjs,.prettierignore,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md,README.md}'
  - '!{.env,.env.*,.npmrc,pnpm-lock.yaml}'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}'
  - '!.claude/**'
  - '!server/**'
  - '!test/**'
  - '!anti-slop/**'
  - '!.github/**'
asarUnpack:
  - resources/**
win:
  executableName: termos
  target:
    - target: nsis
      arch: [x64]
nsis:
  artifactName: termos-${version}-setup-${arch}.${ext}
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: always
mac:
  entitlementsInherit: build/entitlements.mac.plist
  notarize: false
dmg:
  artifactName: termos-${version}.${ext}
linux:
  target:
    - AppImage
    - deb
    - rpm
  executableName: termos
  maintainer: Termos <termos@localhost>
  category: Utility;TerminalEmulator;Network
  synopsis: SSH client & Proxmox manager
  desktop:
    entry:
      StartupWMClass: termos
appImage:
  artifactName: termos-${version}-${arch}.${ext}
deb:
  artifactName: termos-${version}-${arch}.${ext}
  depends:
    - libsecret-1-0
    - libnss3
    - libxtst6
rpm:
  artifactName: termos-${version}-${arch}.${ext}
  depends:
    - libsecret
    - nss
    - libXtst
  fpm:
    # rpm >= 4.14 tries to add build-id links for Electron's binaries and fails.
    - --rpm-rpmbuild-define
    - _build_id_links none
# Updates come from GitHub Releases built by .github/workflows/release.yml; never auto-publish.
publish: null
npmRebuild: false
# Electron fuses are flipped on the packaged binary (no RUN_AS_NODE, NODE_OPTIONS, --inspect).
afterPack: build/afterPack.cjs
