appId: id.termos.app
productName: Termos
directories:
  buildResources: build
files:
  - '!**/.vscode/*'
  - '!src/*'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!{.eslintcache,eslint.config.mjs,.prettierignore,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md,README.md}'
  - '!{.env,.env.*,.npmrc,pnpm-lock.yaml}'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}'
  - '!.claude/**'
asarUnpack:
  - resources/**
win:
  executableName: termos
nsis:
  artifactName: termos-${version}-setup.${ext}
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: always
mac:
  entitlementsInherit: build/entitlements.mac.plist
  notarize: false
dmg:
  artifactName: termos-${version}.${ext}
linux:
  target:
    - AppImage
    - deb
  executableName: termos
  maintainer: Termos <termos@localhost>
  category: Utility;TerminalEmulator;Network
  synopsis: SSH client & Proxmox manager
  desktop:
    entry:
      StartupWMClass: termos
appImage:
  artifactName: termos-${version}-${arch}.${ext}
deb:
  artifactName: termos-${version}-${arch}.${ext}
  depends:
    - libsecret-1-0
    - libnss3
    - libxtst6
npmRebuild: false
# Electron fuses are flipped on the packaged binary (no RUN_AS_NODE, NODE_OPTIONS, --inspect).
afterPack: build/afterPack.cjs
